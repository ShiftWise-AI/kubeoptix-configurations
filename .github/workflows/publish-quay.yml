name: Publish image to Quay

on:
  pull_request:
    branches: [main, stage, develop]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches:
      - main
      - stage
      - develop
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: quay-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  branch-flow:
    uses: ./.github/workflows/branch-limits.yml

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: kubeoptix_ci
          POSTGRES_USER: kubeoptix_ci
          POSTGRES_PASSWORD: ci-only-ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kubeoptix_ci -d kubeoptix_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRESQL_HOST: localhost
      POSTGRESQL_PORT: '5432'
      POSTGRESQL_DATABASE: kubeoptix_ci
      POSTGRESQL_USER: kubeoptix_ci
      POSTGRESQL_PASSWORD: ci-only-ephemeral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - run: bash ./mvnw -B verify -DskipITs=false

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate workflow syntax
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= .github/workflows/*.yml
      - name: Scan dependencies and secrets
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          skip-dirs: .git,.venv,target,node_modules,.cache

  publish:
    needs: [branch-flow, test, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag in vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit on main." >&2
            exit 1
          }
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Containerfile
          push: false
          load: true
          tags: |
            quay.io/parraes/kubeoptix-configurations:${{ steps.release.outputs.version || (github.ref == 'refs/heads/main' && 'latest' || 'pr-check') }}
            quay.io/parraes/kubeoptix-configurations:sha-${{ github.sha }}

      - name: Require a non-root runtime
        env:
          IMAGE: quay.io/parraes/kubeoptix-configurations:sha-${{ github.sha }}
        run: |
          user="$(docker image inspect "$IMAGE" --format '{{.Config.User}}')"
          if [[ -z "$user" || "${user%%:*}" == '0' || "${user%%:*}" == 'root' ]]; then
            echo '::error::The runtime image must declare a non-root USER.'
            exit 1
          fi

      - name: Scan the built image and runtime configuration
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        env:
          TRIVY_IMAGE_CONFIG_SCANNERS: misconfig,secret
        with:
          version: v0.69.3
          image-ref: quay.io/parraes/kubeoptix-configurations:sha-${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false

      - name: Check publishing credentials
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          if [[ -z "$QUAY_USERNAME" || -z "$QUAY_PASSWORD" ]]; then
            echo '::error::Configure QUAY_USERNAME and QUAY_PASSWORD for this repository.'
            exit 1
          fi

      - name: Log in to Quay
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Publish only the scanned image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          IMAGE: quay.io/parraes/kubeoptix-configurations
          IMAGE_TAG: ${{ steps.release.outputs.version || 'latest' }}
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:$IMAGE_TAG"

  ci-required:
    if: always()
    needs: [branch-flow, test, security, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"